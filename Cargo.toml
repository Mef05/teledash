[package]
name = "teledash"
version = "0.1.0"
edition = "2024"

[dependencies]
mio = { version = "1.2.3", features = ["net", "os-poll"] }
thiserror = "2.0.21"

axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
